name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install schedule parser
        run: python -m pip install -r requirements-schedule.txt

      - name: Fetch official schedules
        run: python scripts/update_schedule.py static-site/public/schedule.json

      - name: Validate public Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "::error::Set the SUPABASE_URL repository variable." && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "::error::Set the SUPABASE_ANON_KEY repository variable." && exit 1)

      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /Podslushano_ZIEIT/
        run: npm run build:github-pages

      - name: Add Pages marker
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
